[project]
name = "aimaestro"
version = "0.1.0"
description = "A task assistant with long-term memory."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain>=1.3,<2",
    "langchain-core>=1.5,<2",
    "trustcall>=0.0.39",
    "langchain-google-genai>=4.3,<5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
aimaestro = "aimaestro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aimaestro", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# No test should ever hang; a runaway agent loop must fail loudly instead.
timeout = 60
